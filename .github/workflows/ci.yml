name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Repo checks (structure, metadata, style)
        run: python tools/check_release.py --ci
      - name: Fast tests (no network, no third-party data)
        run: python tools/run_tests.py
