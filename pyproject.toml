# Tooling configuration only. This repository is not a single installable package:
# each numbered folder is a self-contained project with its own package.

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".venv", "venv", "*/data/raw", "*/data/cache"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = [
    "RUF001",  # ambiguous unicode in strings: none used on purpose
    "E501",  # long prose strings and comments; ruff format still wraps all code
]

[tool.ruff.lint.isort]
known-first-party = ["house_price", "fraud_detection", "demand_forecast", "text_classification", "rag_eval", "experiment_analysis", "drift_monitor", "fairness_audit", "llm_judge_eval", "extraction_eval", "recsys_eval", "uplift_eval", "promo_lift", "oos_detect", "credit_score"]

[tool.ruff.lint.per-file-ignores]
"*/tests/*" = ["B011"]

[tool.pytest.ini_options]
# One pytest run from the repo root. Package names are unique per project, so the
# project folders can share one import path. importlib mode lets test files in
# different projects share a base name.
addopts = "-q --import-mode=importlib"
testpaths = [
    "01-house-price-regression/tests",
    "02-fraud-detection/tests",
    "03-demand-forecasting/tests",
    "04-text-classification/tests",
    "05-rag-evals/tests",
    "06-experiment-analysis/tests",
    "07-model-monitoring/tests",
    "08-fairness-audit/tests",
    "09-llm-judge-eval/tests",
    "10-structured-extraction/tests",
    "11-recommender-eval/tests", "12-uplift-modelling/tests", "13-promotion-lift/tests", "14-out-of-stock-detection/tests", "15-credit-scorecard/tests",
]
pythonpath = ["01-house-price-regression", "02-fraud-detection", "03-demand-forecasting", "04-text-classification", "05-rag-evals", "06-experiment-analysis", "07-model-monitoring", "08-fairness-audit", "09-llm-judge-eval", "10-structured-extraction", "11-recommender-eval", "12-uplift-modelling", "13-promotion-lift", "14-out-of-stock-detection", "15-credit-scorecard"]
